name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
        env:
          FOLIO_DATA_DIR: ${{ runner.temp }}/folio
      - name: Launcher syntax
        run: node --check bin/folio.mjs
