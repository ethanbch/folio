[project]
name = "folio"
version = "0.1.0"
description = "Local natural-language file search for macOS."
readme = "README.md"
authors = [
    { name = "Ethan Benchetrit", email = "ethan.benchetrit@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pypdfium2>=5.14.0",
    "python-calamine>=0.8.2",
    "sentencepiece>=0.2.2",
    "starlette>=1.7.0",
    "tantivy>=0.26.2",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
folio = "folio.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B008", "B905"]
